<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitZone Training</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fz-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#/classes"><i class="bi bi-lightning-charge-fill"></i> FitZone Training</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#/classes" data-nav="classes">Find a Class</a></li>
          <li class="nav-item"><a class="nav-link" href="#/trainers" data-nav="trainers">Trainers</a></li>
          <li class="nav-item d-none" data-role="customer"><a class="nav-link" href="#/bookings" data-nav="bookings">My Bookings</a></li>
          <li class="nav-item d-none" data-role="trainer"><a class="nav-link" href="#/dashboard" data-nav="dashboard">Trainer Dashboard</a></li>
        </ul>
        <ul class="navbar-nav" id="authNav"></ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="app"></main>

  <!-- Toast notifications -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Reusable modal (forms, confirmations, rosters) -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
